<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>Fullscreen</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><text y='50' font-size='50'>♻</text></svg>">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  #container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
  }

  #container iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }
</style>
<script>
var GET={}
var query = window.location.search.substring(1);
if(query!='')
{
	var vars = query.split('&');
	if(vars.length>0)
	{
		for (var i = 0; i < vars.length; i++) {
			var pair = vars[i].split('=');
			GET[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1]);
		}
	}
}
document.addEventListener("DOMContentLoaded", function(){
	i=document.createElement('iframe');
	i.setAttribute('allow','autoplay; encrypted-media');
	i.src='https://www.youtube.com/embed/'+((GET.id)?GET.id:'slVo7yCJD0U')+'?controls=1&modestbranding=1&rel=0&showinfo=0&autoplay=1';
	i.allowfullscreen='true';
	document.getElementById('container').appendChild(i);
}, false);

</script>
</head>

<body>
<div id="container">
</div>

</body>
</html>
