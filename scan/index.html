<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner de Codes</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <meta name="theme-color" content="#2196F3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <div class="container">
        <header>
            <h1>Scanner de Codes</h1>
            <button id="settingsBtn" class="icon-btn" aria-label="Paramètres">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </header>

        <main>
            <div id="reader" class="scanner-container"></div>
            <div id="status" class="status">Initialisation...</div>
            <div id="lastCode" class="last-code"></div>
            <button id="clearBtn" class="btn btn-secondary">Effacer le dernier code</button>
        </main>
    </div>

    <!-- Modal Paramètres -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Paramètres</h2>
                <button class="close-btn" id="closeSettings">&times;</button>
            </div>
            <div class="modal-body">
                <label for="destinationUrl">URL de destination</label>
                <input type="url" id="destinationUrl" placeholder="https://exemple.com?code=${code}">
                <p class="help-text">Utilisez <code>${code}</code> pour insérer le code scanné dans l'URL</p>
            </div>
            <div class="modal-footer">
                <button id="saveSettings" class="btn btn-primary">Enregistrer</button>
            </div>
        </div>
    </div>

    <!-- Modal Code Scanné -->
    <div id="scanModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Code Scanné</h2>
                <button class="close-btn" id="closeScan">&times;</button>
            </div>
            <div class="modal-body">
                <p class="scan-info">Code détecté :</p>
                <p id="scannedCode" class="code-display"></p>
                <p class="scan-info">URL de destination :</p>
                <a id="destinationLink" href="#" target="_blank" class="url-link"></a>
            </div>
            <div class="modal-footer">
                <button id="openUrl" class="btn btn-primary">Ouvrir l'URL</button>
                <button id="copyUrl" class="btn btn-secondary">Copier l'URL</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
